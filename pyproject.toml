    "httpx (>=0.28.1,<0.29.0)",
    "pytest (>=8.3.5,<9.0.0)",
    "pytest-asyncio (>=1.0.0,<2.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "async-timeout (>=5.0.1,<6.0.0)",
    "setuptools (>=80.9.0,<81.0.0)",
    "pydantic-settings (>=2.9.1,<3.0.0)",
